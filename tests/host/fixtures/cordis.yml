# Deterministic model for the shipped dsh tui profile; never uses provider keys.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: tui-fixture
    model: deterministic

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_TUI_TEST_STORE
    compression: none

- insert:
    - id: tui-fixture-llm
      name: './tui-llm.ts'
