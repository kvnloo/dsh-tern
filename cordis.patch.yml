# An additive dsh.bundle.patch layer applied after dsh-base.
# Agent and Session remain owned by the unmodified host.
- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: tui-startup
      name: '@kvnloo/dsh-tern/startup'
    - id: tui-app
      name: '@kvnloo/dsh-tern'
      inject: [tuiStartup]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId
        native: !!js ctx.tuiStartup.native

- id: hmr
  disabled: true
